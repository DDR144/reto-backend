spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - PreserveHostHeader
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**
              filters:
                - PreserveHostHeader
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer usado para validar el claim "iss" del JWT emitido por Keycloak
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8083/realms/reto-backend}
          # endpoint interno de JWKS (accesible desde el contenedor del gateway)
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8083/realms/reto-backend/protocol/openid-connect/certs}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  pattern:
    level: "%5p [X-Trace-Id=%X{traceId:-}]"

trace:
  header-name: X-Trace-Id
