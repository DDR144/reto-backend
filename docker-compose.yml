services:

  order-db:
    image: postgres:16-alpine
    container_name: reto-order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: reto_user
      POSTGRES_PASSWORD: reto_pass
    volumes:
      - order_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reto_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-db:
    image: postgres:16-alpine
    container_name: reto-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: reto_user
      POSTGRES_PASSWORD: reto_pass
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reto_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: reto-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 15

  gateway:
    build: ./api-gateway
    container_name: reto-gateway
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      ORDER_SERVICE_URI: http://order-service:8081
      INVENTORY_SERVICE_URI: http://inventory-service:8082
      KEYCLOAK_ISSUER_URI: http://localhost:8083/realms/reto-backend
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/reto-backend/protocol/openid-connect/certs
    ports:
      - "8080:8080"

  order-service:
    build: ./order-service
    container_name: reto-order-service
    restart: unless-stopped
    depends_on:
      order-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      POSTGRES_URL: r2dbc:postgresql://order-db:5432/order_db
      POSTGRES_USER: reto_user
      POSTGRES_PASSWORD: reto_pass
      KEYCLOAK_ISSUER_URI: http://localhost:8083/realms/reto-backend
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/reto-backend/protocol/openid-connect/certs
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    ports:
      - "8081:8081"

  inventory-service:
    build: ./inventory-service
    container_name: reto-inventory-service
    restart: unless-stopped
    depends_on:
      inventory-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      POSTGRES_URL: r2dbc:postgresql://inventory-db:5432/inventory_db
      POSTGRES_USER: reto_user
      POSTGRES_PASSWORD: reto_pass
      KEYCLOAK_ISSUER_URI: http://localhost:8083/realms/reto-backend
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/reto-backend/protocol/openid-connect/certs
    ports:
      - "8082:8082"

volumes:
  order_db_data:
  inventory_db_data:
